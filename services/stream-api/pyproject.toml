[project]
name = "stt-stream-api"
version = "0.1.0"
description = "Ingests streaming audio over gRPC"
requires-python = ">=3.12"
dependencies = [
	"grpcio>=1.80.0",
	"protobuf>=6.30.2",
	"redis>=6.1.0",
	"av>=14.0.0",
	"numpy>=2.0.0",
	"pydantic-settings>=2.0.0",
	"stt-common",
]

[dependency-groups]
dev = [
	"grpcio-tools>=1.80.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_api"]



