[project]
name = "stt-rest-api"
version = "0.1.0"
description = "REST + WebSocket API wrapper that fronts the stream-api gRPC pipeline"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.32.0",
	"python-socketio>=5.12.0",
	"sqlalchemy[asyncio]>=2.0.36",
	"asyncpg>=0.30.0",
	"alembic>=1.14.0",
	"aioboto3>=13.0.0",
	"pydantic>=2.9.0",
	"pydantic-settings>=2.0.0",
	"pyjwt>=2.9.0",
	"grpcio>=1.80.0",
	"protobuf>=6.30.2",
	"stt-common",
	"openai>=1.40.0",
	"webrtcvad-wheels==2.0.14",
	"httpx2>=2.12.0",
	"numpy>=2.0.0",
]

[dependency-groups]
dev = [
	"grpcio-tools>=1.80.0",
	"httpx>=0.27.0",
	"pytest-asyncio>=0.24.0",
	"aiosqlite>=0.20.0",
	"testcontainers[postgres]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rest_api"]




