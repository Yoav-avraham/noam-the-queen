[project]
name = "stt-synchronizer"
version = "0.1.0"
description = "Synchronizes model responses into realtime output"
requires-python = ">=3.12"
dependencies = [
	"pydantic-settings>=2.0.0",
	"python-i18n>=0.3.9",
	"stt-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synchronizer"]



