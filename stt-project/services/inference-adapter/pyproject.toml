[project]
name = "stt-inference-adapter"
version = "0.1.0"
description = "Audio adaptation and normalization service scaffold"
requires-python = ">=3.12"
dependencies = [
	"av>=14.0.0",
	"grpcio>=1.80.0",
	"numpy>=2.0.0",
	"setuptools>=71.1.0",
    "tritonclient[grpc]==2.41.0",
    "webrtcvad-wheels==2.0.14",
	"stt-common",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_adapter"]




