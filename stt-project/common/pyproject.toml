[project]
name = "stt-common"
version = "0.1.0"
description = "Shared definitions and utilities for STT services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "redis>=6.1.0",
    "pyright>=1.1.401,<1.1.411",
	"grpcio>=1.80.0",
	"protobuf>=4.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_common"]
