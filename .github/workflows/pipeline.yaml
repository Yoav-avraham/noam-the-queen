name: Package Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install bundle-deps bundle-code

      - name: Build dependencies (unpacked)
        run: |
          bundle-deps . --manylinux --no-pack \
            --bundle-name dependencies --output-dir "$RUNNER_TEMP/package"

      - name: Copy code (unpacked)
        run: |
          IGNORE=()
          if [ -f .transferignore ]; then IGNORE=(--ignore .transferignore); fi
          bundle-code . "$RUNNER_TEMP/package/code" "${IGNORE[@]}"

      - name: Show output
        run: find "$RUNNER_TEMP/package" -maxdepth 2

      # the artifact itself is the only archive (GitHub zips it)
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
