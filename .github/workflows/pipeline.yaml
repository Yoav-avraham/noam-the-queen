name: Package Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # חייב לרוץ לפני bundle.py, ראה הסבר למטה
      - name: Collect changed files
        id: changes
        run: python scripts/pull_changes.py

      - name: Build dependencies bundle
        run: python scripts/bundle.py export . --manylinux

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files
          path: ${{ steps.changes.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload dependencies bundle
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-bundle
          path: "*.tar.gz"
          compression-level: 0   # הקובץ כבר דחוס, אין טעם לדחוס שוב
          if-no-files-found: error
          retention-days: 14
