name: Package Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build dependencies bundle
        run: python scripts/bundle.py export . --manylinux

      - name: Upload dependencies bundle
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-bundle
          path: "*.tar.gz"
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy code with ignore filter
        run: |
          python scripts/copy_script.py . code .transferignore

      - name: Upload code
        uses: actions/upload-artifact@v4
        with:
          name: code
          path: code
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package:
    runs-on: ubuntu-latest
    needs: [dependencies, code]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: package

      - name: Show output
        run: find package -type f

      - name: Archive, base64 and split into 25MB parts
        run: |
          mkdir -p final-package
          tar -czf package.tar.gz -C package .
          base64 -w 0 package.tar.gz > package.b64
          split -b 25M -d -a 3 package.b64 final-package/package.b64.part-
          ls -lh final-package

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: final-package
          path: final-package
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
